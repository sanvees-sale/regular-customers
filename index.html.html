<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanvee's by Tony - Premium Customer Portal</title>
    <!-- Google Fonts for High-End Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #8e24aa;
            --primary-dark: #6a1b9a;
            --primary-light: #f3e5f5;
            --accent: #d81b60;
            --gold: #dfa100;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.02);
            --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
            --shadow-lg: 0 20px 25px -5px rgba(142, 36, 170, 0.1), 0 8px 10px -6px rgba(142, 36, 170, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            background-image: 
                radial-gradient(at 0% 0%, rgba(142, 36, 170, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(216, 27, 96, 0.05) 0px, transparent 50%);
        }

        .app-wrapper {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Glassmorphic Brand Header */
        .brand-header {
            background: linear-gradient(135deg, #2a0845 0%, #641375 50%, #8e24aa 100%);
            border-radius: var(--radius-lg);
            padding: 40px;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 350px;
            height: 350px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            pointer-events: none;
        }

        .brand-info h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            background: linear-gradient(to right, #ffffff, #f3e5f5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-info p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .brand-badge {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Analytics Overview Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        .stat-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .stat-icon.purple { background: #f3e5f5; color: var(--primary); }
        .stat-icon.pink { background: #fce4ec; color: var(--accent); }
        .stat-icon.gold { background: #fff8e1; color: var(--gold); }

        .stat-details h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .stat-details p {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
        }

        /* Layout Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 30px;
        }

        @media (max-width: 992px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Form Card */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            padding: 28px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .card-header i {
            color: var(--primary);
            font-size: 1.2rem;
        }

        .card-header h2 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            color: var(--text-main);
            background: #fafafa;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-control:focus {
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(142, 36, 170, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(142, 36, 170, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(142, 36, 170, 0.35);
        }

        /* Action Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-field {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-field i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .search-field input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            background: white;
            font-size: 0.9rem;
            outline: none;
            box-shadow: var(--shadow-sm);
        }

        .search-field input:focus {
            border-color: var(--primary);
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }

        .btn-secondary {
            background: white;
            color: var(--text-main);
            border: 1.5px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            width: auto;
            padding: 10px 18px;
        }

        .btn-secondary:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
        }

        .btn-print {
            background: #0284c7;
            color: white;
            border: none;
            width: auto;
            padding: 10px 18px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
        }

        .btn-print:hover {
            background: #0369a1;
        }

        /* Modern Data Table */
        .table-container {
            background: white;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            padding: 16px 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
        }

        tbody tr {
            border-bottom: 1px solid var(--border-color);
            transition: background 0.15s ease;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #fdf4ff;
        }

        td {
            padding: 16px 20px;
            font-size: 0.9rem;
            color: var(--text-main);
            vertical-align: middle;
        }

        .customer-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary-light);
            color: var(--primary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85rem;
            margin-right: 10px;
        }

        .phone-badge {
            font-family: monospace;
            background: #f1f5f9;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #334155;
        }

        .amount-tag {
            font-weight: 700;
            color: #059669;
        }

        .qty-tag {
            display: inline-block;
            padding: 2px 10px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .btn-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            background: #fee2e2;
            color: #dc2626;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-icon:hover {
            background: #dc2626;
            color: white;
        }

        /* Printable Invoice Header (Hidden on Screen) */
        .print-only-header {
            display: none;
        }

        /* PRINT STYLES - Designer Layout for Printing */
        @media print {
            body {
                background: white !important;
                padding: 0 !important;
                color: #000 !important;
            }

            .app-wrapper {
                max-width: 100% !important;
            }

            .brand-header, 
            .stats-grid, 
            .card, 
            .toolbar, 
            .btn-icon, 
            th:last-child, 
            td:last-child {
                display: none !important;
            }

            .main-grid {
                display: block !important;
            }

            .table-container {
                border: 1px solid #333 !important;
                box-shadow: none !important;
                border-radius: 0 !important;
            }

            .print-only-header {
                display: block !important;
                text-align: center;
                margin-bottom: 30px;
                padding-bottom: 15px;
                border-bottom: 2px solid #000;
            }

            .print-only-header h1 {
                font-family: 'Playfair Display', serif;
                font-size: 28pt;
                text-transform: uppercase;
                margin-bottom: 4px;
            }

            .print-only-header p {
                font-size: 11pt;
                color: #555;
            }

            .print-date {
                margin-top: 8px;
                font-size: 9pt;
                color: #777;
            }

            table {
                width: 100% !important;
                border-collapse: collapse !important;
            }

            th {
                background-color: #f0f0f0 !important;
                color: #000 !important;
                border: 1px solid #333 !important;
                font-size: 10pt !important;
                padding: 8px !important;
            }

            td {
                border: 1px solid #ddd !important;
                font-size: 10pt !important;
                padding: 8px !important;
            }

            .amount-tag {
                color: #000 !important;
            }

            .phone-badge, .qty-tag {
                background: none !important;
                padding: 0 !important;
                color: #000 !important;
            }
        }
    </style>
</head>
<body>

<div class="app-wrapper">

    <!-- Printable Header (Only active on print) -->
    <div class="print-only-header">
        <h1>Sanvee's by Tony</h1>
        <p>Valued Customer Purchase & Order Summary</p>
        <p class="print-date">Generated on: <span id="printDate"></span></p>
    </div>

    <!-- Main Header -->
    <header class="brand-header">
        <div class="brand-info">
            <h1>Sanvee's by Tony</h1>
            <p>Exclusive Customer Relationship & Order Tracking System</p>
        </div>
        <div class="brand-badge">
            <i class="fa-solid fa-crown" style="color: #ffd700; margin-right: 6px;"></i> VIP Portal
        </div>
    </header>

    <!-- Analytics Dashboard -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon purple"><i class="fa-solid fa-users"></i></div>
            <div class="stat-details">
                <h3>Total Customers</h3>
                <p id="totalCustomers">0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon pink"><i class="fa-solid fa-bangladeshi-taka-sign"></i></div>
            <div class="stat-details">
                <h3>Total Revenue</h3>
                <p id="totalRevenue">৳ 0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon gold"><i class="fa-solid fa-box-open"></i></div>
            <div class="stat-details">
                <h3>Parcels Shipped</h3>
                <p id="totalParcels">0</p>
            </div>
        </div>
    </div>

    <!-- Content Layout -->
    <div class="main-grid">
        
        <!-- Left Column: Add Customer Form -->
        <div class="card">
            <div class="card-header">
                <i class="fa-solid fa-user-plus"></i>
                <h2>Add New Customer</h2>
            </div>
            <form id="customerForm">
                <div class="form-group">
                    <label>Customer Name</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="name" class="form-control" placeholder="e.g. Anika Rahman" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" id="phone" class="form-control" placeholder="017XXXXXXXX" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Total Purchase (BDT)</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-money-bill-wave"></i>
                        <input type="number" id="amount" class="form-control" placeholder="e.g. 4500" min="0" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Parcel Quantity</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-cubes"></i>
                        <input type="number" id="quantity" class="form-control" placeholder="e.g. 2" min="1" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-plus"></i> Save Customer Entry
                </button>
            </form>
        </div>

        <!-- Right Column: Data View & Actions -->
        <div>
            <!-- Toolbar -->
            <div class="toolbar">
                <div class="search-field">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" onkeyup="searchCustomer()" placeholder="Search by customer name or phone number...">
                </div>
                <div class="action-btns">
                    <button class="btn btn-print" onclick="window.print()">
                        <i class="fa-solid fa-print"></i> Print Report
                    </button>
                    <button class="btn btn-secondary" onclick="exportToCSV()">
                        <i class="fa-solid fa-file-excel"></i> Export CSV
                    </button>
                </div>
            </div>

            <!-- Table -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Customer</th>
                            <th>Phone</th>
                            <th>Total Spent</th>
                            <th>Parcels</th>
                            <th style="text-align: right;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Dynamic Records -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        loadCustomers();
        document.getElementById('printDate').innerText = new Date().toLocaleDateString('en-US', {
            year: 'numeric', month: 'long', day: 'numeric'
        });
    });

    const form = document.getElementById('customerForm');
    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const amount = document.getElementById('amount').value;
        const quantity = document.getElementById('quantity').value;

        const customer = { id: Date.now(), name, phone, amount, quantity };

        saveCustomer(customer);
        form.reset();
        loadCustomers();
    });

    function getCustomers() {
        return JSON.parse(localStorage.getItem('sanvees_premium_db')) || [];
    }

    function saveCustomer(customer) {
        const customers = getCustomers();
        customers.unshift(customer); // Latest first
        localStorage.setItem('sanvees_premium_db', JSON.stringify(customers));
    }

    function deleteCustomer(id) {
        if(confirm('Are you sure you want to remove this record?')) {
            let customers = getCustomers();
            customers = customers.filter(c => c.id !== id);
            localStorage.setItem('sanvees_premium_db', JSON.stringify(customers));
            loadCustomers();
        }
    }

    function updateStats(customers) {
        document.getElementById('totalCustomers').innerText = customers.length;
        
        const revenue = customers.reduce((sum, c) => sum + Number(c.amount), 0);
        document.getElementById('totalRevenue').innerText = '৳ ' + revenue.toLocaleString();

        const parcels = customers.reduce((sum, c) => sum + Number(c.quantity), 0);
        document.getElementById('totalParcels').innerText = parcels;
    }

    function loadCustomers() {
        const customers = getCustomers();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        updateStats(customers);

        if(customers.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" style="text-align:center; padding: 40px; color: var(--text-muted);">
                        <i class="fa-solid fa-box-open" style="font-size: 2rem; margin-bottom: 10px; display:block;"></i>
                        No customer entries found. Add your first customer from the left panel.
                    </td>
                </tr>`;
            return;
        }

        customers.forEach((c) => {
            const initial = c.name.charAt(0).toUpperCase();
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>
                    <div style="display: flex; align-items: center;">
                        <span class="customer-avatar">${initial}</span>
                        <strong>${c.name}</strong>
                    </div>
                </td>
                <td><span class="phone-badge">${c.phone}</span></td>
                <td><span class="amount-tag">৳ ${Number(c.amount).toLocaleString()}</span></td>
                <td><span class="qty-tag">${c.quantity} items</span></td>
                <td style="text-align: right;">
                    <button class="btn-icon" onclick="deleteCustomer(${c.id})" title="Delete Customer">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    function searchCustomer() {
        const filter = document.getElementById('searchInput').value.toLowerCase();
        const rows = document.querySelectorAll('#tableBody tr');

        rows.forEach(row => {
            const text = row.innerText.toLowerCase();
            row.style.display = text.includes(filter) ? '' : 'none';
        });
    }

    function exportToCSV() {
        const customers = getCustomers();
        if(customers.length === 0) {
            alert('No data available to export!');
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "Customer Name,Phone Number,Total Purchase Amount (BDT),Parcel Quantity\n";

        customers.forEach((c) => {
            csvContent += `"${c.name}","${c.phone}",${c.amount},${c.quantity}\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "Sanvees_Customer_Report.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
